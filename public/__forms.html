<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="Prénom" />
      <input name="Nom" />
      <input name="email" />
      <input name="Téléphone" />
      <input name="Type de demande" />
      <input name="Structure" />
      <input name="Fonction" />
      <input name="Service recherché" />
      <input name="Préférence de contact" />
      <textarea name="Message"></textarea>
    </form>
  </body>
</html>
